<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTU MAKER</title>

<!-- Google Fonts: Raleway -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: linear-gradient(to bottom, #f36c21 0%, #f4f1ec 60%);
    color: #222;
    font-family: 'Raleway', sans-serif;
}

.container {
    width: 92%;
    max-width: 560px;
    margin: auto;
    padding: 45px 0 35px;
    text-align: center;
}

.logo {
    display: block;
    width: 100%;
    margin-bottom: 18px;
    border-radius: 18px;
    box-shadow: 0 0 12px rgba(243,108,33,0.6);
    transition: 0.2s;
}
.logo:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(243,108,33,0.8);
}

.tagline {
    font-size: 14px;
    letter-spacing: 5px;
    color: #fff;
    margin-bottom: 45px;
    font-weight: 400;
    text-transform: uppercase;
}

.link {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #222;
    background: #e5e1da;
    border: 1px solid #d2cdc4;
    border-radius: 18px;
    padding: 22px 24px;
    margin: 18px 0;
    box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    transition: 0.3s;
}
.link:hover {
    transform: translateY(-2px);
    background: #f4f1ec;
    box-shadow: 0 12px 26px rgba(0,0,0,0.12);
}

.icon {
    width: 58px;
    height: 58px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.icon svg {
    width: 28px;
    height: 28px;
}

.text {
    text-align: left;
    margin-left: 20px;
    flex: 1;
}
.title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 5px;
}
.subtitle {
    font-size: 15px;
    color: #666;
}

.arrow {
    font-size: 30px;
    color: #222;
    margin-left: 10px;
}

.footer {
    margin-top: 55px;
    font-size: 22px;
    letter-spacing: 6px;
    font-weight: 400;
    color: #fff;
    background: #f36c21;
    padding: 12px; /* daha az yükseklik */
    border-radius: 8px;
    text-transform: uppercase;
}

@media (max-width: 480px) {
    .container { padding-top: 30px; }
    .tagline { font-size: 11px; letter-spacing: 3px; margin-bottom: 35px; }
    .link { padding: 18px; }
    .icon { width: 50px; height: 50px; }
    .title { font-size: 17px; }
    .subtitle { font-size: 14px; }
    .footer { font-size: 18px; letter-spacing: 5px; padding: 10px; }
}
</style>
</head>
<body>

<div class="container">

    <img src="yeni-logo.jpeg" class="logo" alt="Yeni Logo">

    <div class="tagline">
        DESIGN • CREATE • BUILD
    </div>

    <!-- İskender Pala Linki -->
    <a class="link" href="https://www.instagram.com/usakiskenderpalaihk/" target="_blank">
        <div class="icon">
            <!-- Renkli Instagram SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <defs>
                    <linearGradient id="IGgrad1" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#f58529"/>
                        <stop offset="30%" stop-color="#feda77"/>
                        <stop offset="60%" stop-color="#dd2a7b"/>
                        <stop offset="100%" stop-color="#8134af"/>
                    </linearGradient>
                </defs>
                <path fill="url(#IGgrad1)" d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.65 0 3 1.35 3 3v10c0 1.65-1.35 3-3 3H7c-1.65 0-3-1.35-3-3V7c0-1.65 1.35-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-2a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/>
            </svg>
        </div>
        <div class="text">
            <div class="title">İskender Pala İl Halk Kütüphanesi</div>
            <div class="subtitle">Instagram</div>
        </div>
        <div class="arrow">›</div>
    </a>

    <!-- Motu Maker Linki -->
    <a class="link" href="https://www.instagram.com/motu_maker/" target="_blank">
        <div class="icon">
            <!-- Renkli Instagram SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <defs>
                    <linearGradient id="IGgrad2" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#f58529"/>
                        <stop offset="30%" stop-color="#feda77"/>
                        <stop offset="60%" stop-color="#dd2a7b"/>
                        <stop offset="100%" stop-color="#8134af"/>
                    </linearGradient>
                </defs>
                <path fill="url(#IGgrad2)" d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.65 0 3 1.35 3 3v10c0 1.65-1.35 3-3 3H7c-1.65 0-3-1.35-3-3V7c0-1.65 1.35-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-2a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/>
            </svg>
        </div>
        <div class="text">
            <div class="title">Motu Maker</div>
            <div class="subtitle">Instagram</div>
        </div>
        <div class="arrow">›</div>
    </a>

    <div class="footer">
        OKAN ÖZDENİZ
    </div>

</div>

</body>
</html>
