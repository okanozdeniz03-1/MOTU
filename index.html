<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTU MAKER</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f1ec;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 92%;
    max-width: 560px;
    margin: auto;
    padding: 45px 0 35px;
    text-align: center;
}

.logo {
    width: 100%;             /* container genişliğini kaplar */
    max-width: 420px;        /* masaüstünde üst sınır */
    margin-bottom: 12px;
    background-color: #fff;   /* beyaz arka plan */
    padding: 12px;            /* iç boşluk */
    border: 3px solid #f36c21; /* turuncu çerçeve (biraz kalın) */
    /* border-radius kaldırıldı → kare görünüm */
}

.tagline {
    font-size: 13px;
    letter-spacing: 5px;
    color: #444;
    margin-bottom: 45px;
}

.tagline span {
    color: #f36c21;
}

.link {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #222;
    background: #e5e1da;
    border: 1px solid #d2cdc4;
    border-radius: 18px;
    padding: 22px 24px;
    margin: 18px 0;
    box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.link:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(0,0,0,0.12);
}

.icon {
    width: 58px;
    height: 58px;
    border-radius: 14px;
    background: #f36c21;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    flex-shrink: 0;
}

.text {
    text-align: left;
    margin-left: 20px;
    flex: 1;
}

.title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 15px;
    color: #666;
}

.arrow {
    font-size: 30px;
    color: #222;
    margin-left: 10px;
}

.footer {
    margin-top: 55px;
    font-size: 18px;
    letter-spacing: 5px;
    font-weight: 500;
    color: #333;
}

@media (max-width: 480px) {

    .container {
        padding-top: 30px;
    }

    .logo {
        width: 90%;   /* mobilde daha dengeli */
        max-width: 300px;
    }

    .tagline {
        font-size: 11px;
        letter-spacing: 3px;
        margin-bottom: 35px;
    }

    .link {
        padding: 18px;
    }

    .icon {
        width: 50px;
        height: 50px;
        font-size: 23px;
    }

    .title {
        font-size: 17px;
    }

    .subtitle {
        font-size: 14px;
    }

    .footer {
        font-size: 15px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<div class="container">

    <img src="yeni-logo.jpeg" class="logo" alt="Yeni Logo">

    <div class="tagline">
        DESIGN <span>•</span> CREATE <span>•</span> BUILD
    </div>

    <a class="link"
       href="https://www.instagram.com/usakiskenderpalaihk/"
       target="_blank">

        <div class="icon">📖</div>

        <div class="text">
            <div class="title">İskender Pala İl Halk Kütüphanesi</div>
            <div class="subtitle">Instagram</div>
        </div>

        <div class="arrow">›</div>

    </a>

    <a class="link"
       href="https://www.instagram.com/motu_maker/"
       target="_blank">

        <div class="icon">◎</div>

        <div class="text">
            <div class="title">Motu Maker</div>
            <div class="subtitle">Instagram</div>
        </div>

        <div class="arrow">›</div>

    </a>

    <div class="footer">
        OKAN ÖZDENİZ
    </div>

</div>

</body>
</html>
